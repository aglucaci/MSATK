[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "msatk"
version = "0.1.0"
description = "Multiple Sequence Alignment Toolkit for statistics, plots, QC, codon summaries, and reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexander Lucaci" }]
keywords = ["bioinformatics", "multiple sequence alignment", "phylogenetics", "codon usage", "RSCU", "sequence analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dataframes = ["pandas>=2"]
plots = ["matplotlib>=3.7", "seaborn>=0.13"]
embed = ["numpy>=1.24", "scikit-learn>=1.3", "umap-learn>=0.5"]
rich = ["rich>=13", "typer>=0.12"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5,<9.7", "mkdocstrings[python]>=0.26"]
all = ["pandas>=2", "matplotlib>=3.7", "seaborn>=0.13", "numpy>=1.24", "scikit-learn>=1.3", "umap-learn>=0.5", "rich>=13", "typer>=0.12", "plotly>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.8", "pre-commit>=3.7"]

[project.scripts]
msatk = "msatk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msatk"]

[tool.hatch.build.targets.wheel.force-include]
"src/msatk/py.typed" = "msatk/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--basetemp=.tmp/pytest"]
markers = [
  "slow: marks tests as slow",
  "integration: full workflow tests",
  "plot: tests that generate figures",
  "regression: snapshot-style tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.10"
packages = ["msatk"]
ignore_missing_imports = true
